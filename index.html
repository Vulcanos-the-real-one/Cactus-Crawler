<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Cactus Crawler</title>
  <!-- Relative path with no leading slash, for GitHub Pages -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Particle effect canvas -->
  <canvas id="particle-canvas"></canvas>

  <div id="game-container">

    <!-- TOPBAR -->
    <header id="topbar">
      <h1>🌵 CACTUS CRAWLER</h1>
      <button id="sound-toggle-btn" class="icon-btn" aria-label="Toggle sound">🔊</button>
    </header>

    <!-- DUNGEON SECTION -->
    <section id="dungeon-zone">
      <div class="header-info">
        <span class="badge">Floor: <span id="floor">1</span></span>
        <span id="monster-type-badge" class="badge">Room 1</span>
      </div>

      <div id="monster-info">
        <h2 id="monster-name">Loading enemy...</h2>
        <div class="hp-bar-container">
          <div id="monster-hp-bar"></div>
        </div>
        <p id="monster-hp-text"><span id="monster-hp">0</span> / <span id="monster-max-hp">0</span> HP</p>
      </div>

      <!-- ARENA / DUNGEON ROOM -->
      <div id="arena" class="dungeon-room">
        <div class="room-door"></div>
        <div id="crates-layer"></div>

        <!-- Player & monster entities -->
        <div id="player-entity">
          <img id="player-img" src="assets/cactus.png" alt="Player">
        </div>

        <div id="monster-entity">
          <img id="monster-img" src="assets/snail.png" alt="Monster">
        </div>

        <div id="range-hint" class="hidden">Too far away!</div>
      </div>

      <p id="dungeon-hint" class="hint-text">Walk up to the monster and tap it to attack!</p>

      <!-- JOYSTICK -->
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-knob"></div>
        </div>
      </div>
    </section>

    <!-- CLICKER & UPGRADE SECTION -->
    <section id="clicker-zone">

      <!-- STATS BAR -->
      <div id="stats">
        <div class="stat-box">
          💧 <span id="water">0</span>
        </div>
        <div class="stat-box">
          🪙 <span id="gold">0</span>
        </div>
        <div class="stat-box">
          ⚔️ PWR: <span id="power">1</span>
        </div>
      </div>

      <!-- ACTIVE CHARACTER INFO -->
      <div id="active-character-bar">
        <div class="active-char-line">Active: <strong id="active-char-name">Cactus</strong></div>
        <span id="active-char-ability">No Ability</span>

        <div class="hydration-row">
          <span class="hydration-label">🌵💧</span>
          <div class="hydration-bar-container">
            <div id="hydration-bar"></div>
          </div>
          <span id="hydration-text">100/100</span>
        </div>
        <button id="quick-refill-btn" class="btn-action btn-blue btn-compact">
          <span>Refill</span>
          <span>Cost: <span id="refill-cost">0</span> 💧</span>
        </button>
      </div>

      <!-- CLICK AREA -->
      <div id="click-area">
        <img id="cactus-clicker" src="assets/cactus.png" alt="Click the cactus" class="cactus-img">
      </div>

      <!-- TABS -->
      <div class="tab-buttons">
        <button id="tab-upgrades-btn" class="tab-btn active">Upgrades</button>
        <button id="tab-inventory-btn" class="tab-btn">Cacti</button>
        <button id="tab-oasis-btn" class="tab-btn">Oasis</button>
        <button id="tab-quests-btn" class="tab-btn">Quests</button>
        <button id="tab-gamble-btn" class="tab-btn">Casino</button>
      </div>

      <!-- TAB 1: UPGRADES -->
      <div id="tab-upgrades" class="tab-content active">
        <button id="upgrade-water-btn" class="btn-action">
          <span>Water Yield (+1/Click)</span>
          <span>Cost: <span id="cost-water">10</span> 💧</span>
        </button>

        <button id="upgrade-power-btn" class="btn-action btn-gold">
          <span>Cactus Power (+1 PWR)</span>
          <span>Cost: <span id="cost-power">15</span> 🪙</span>
        </button>
      </div>

      <!-- TAB 2: INVENTORY / CHARACTERS -->
      <div id="tab-inventory" class="tab-content">
        <div id="inventory-list">
          <!-- Filled dynamically via JS -->
        </div>
      </div>

      <!-- TAB 3: OASIS -->
      <div id="tab-oasis" class="tab-content">
        <p class="tab-note">Rest here to rehydrate your cacti and stock up on boosts.</p>
        <div id="oasis-list">
          <!-- Filled dynamically via JS -->
        </div>
      </div>

      <!-- TAB 4: QUESTS -->
      <div id="tab-quests" class="tab-content">
        <div id="quests-list">
          <!-- Filled dynamically via JS -->
        </div>
      </div>

      <!-- TAB 5: CASINO -->
      <div id="tab-casino" class="tab-content">
        <div class="gamble-box">
          <h4>🎰 Cactus Slot Machine</h4>
          <div id="slot-display">
            <span>🌵</span> <span>🌵</span> <span>🌵</span>
          </div>
          <button id="spin-slot-btn" class="btn-action btn-gold">
            Spin (Cost: 50 🪙)
          </button>
          <button id="open-box-btn" class="btn-action btn-purple" style="margin-top: 8px;">
            Open Secret Box (Cost: 100 💧)
          </button>
        </div>
      </div>

    </section>

  </div>

  <!-- RANDOM EVENT ITEM -->
  <div id="random-event-item" class="hidden">
    ⭐
  </div>

  <!-- Relative path for the script -->
  <script src="script.js"></script>
</body>
</html>
