<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cactus Crawler</title>
  <!-- Relativer Pfad ohne führenden Slash für GitHub Pages -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Partikel Effekt Canvas -->
  <canvas id="particle-canvas"></canvas>

  <div id="game-container">
    
    <!-- TOPBAR -->
    <header id="topbar">
      <h1>🌵 CACTUS CRAWLER</h1>
      <button id="sound-toggle-btn" class="icon-btn">🔊</button>
    </header>

    <!-- DUNGEON SECTION -->
    <section id="dungeon-zone">
      <div class="header-info">
        <span class="badge">Ebene: <span id="floor">1</span></span>
        <span id="monster-type-badge" class="badge">Raum 1</span>
      </div>

      <div id="monster-info">
        <h2 id="monster-name">Gegner wird geladen...</h2>
        <div class="hp-bar-container">
          <div id="monster-hp-bar"></div>
        </div>
        <p id="monster-hp-text"><span id="monster-hp">0</span> / <span id="monster-max-hp">0</span> HP</p>
      </div>

      <!-- ARENA / DUNGEON RAUM -->
      <div id="arena" class="dungeon-room">
        <div class="room-door"></div>
        <div id="crates-layer"></div>
        
        <!-- Spieler & Monster Einheiten -->
        <div id="player-entity">
          <img id="player-img" src="assets/cactus.png" alt="Player">
        </div>
        
        <div id="monster-entity">
          <img id="monster-img" src="assets/snail.png" alt="Monster">
        </div>

        <div id="range-hint" class="hidden">Zu weit weg!</div>
      </div>

      <p id="dungeon-hint" class="hint-text">Bewege dich zum Monster, um automatisch zu greifen!</p>

      <!-- JOYSTICK -->
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-knob"></div>
        </div>
      </div>
    </section>

    <!-- CLICKER & UPGRADE SECTION -->
    <section id="clicker-zone">
      
      <!-- STATS BAR -->
      <div id="stats">
        <div class="stat-box">
          💧 <span id="water">0</span>
        </div>
        <div class="stat-box">
          🪙 <span id="gold">0</span>
        </div>
        <div class="stat-box">
          ⚔️ SCH: <span id="power">1</span>
        </div>
      </div>

      <!-- ACTIVE CHARACTER INFO -->
      <div id="active-character-bar">
        Aktiv: <strong id="active-char-name">Kaktus</strong><br>
        <span id="active-char-ability">Keine Fähigkeit</span>
      </div>

      <!-- CLICK AREA -->
      <div id="click-area">
        <img id="cactus-clicker" src="assets/cactus.png" alt="Kaktus Klicken" class="cactus-img">
      </div>

      <!-- TABS -->
      <div class="tab-buttons">
        <button id="tab-upgrades-btn" class="tab-btn active">Upgrades</button>
        <button id="tab-inventory-btn" class="tab-btn">Kaktusse</button>
        <button id="tab-gamble-btn" class="tab-btn">Casino</button>
      </div>

      <!-- TAB 1: UPGRADES -->
      <div id="tab-upgrades" class="tab-content active">
        <button id="upgrade-water-btn" class="btn-action">
          Wasser-Ertrag (+1/Klick)<br>
          Kosten: <span id="cost-water">10</span> 💧
        </button>
        
        <button id="upgrade-power-btn" class="btn-action btn-gold">
          Kaktus-Kraft (+1 SCH)<br>
          Kosten: <span id="cost-power">15</span> 🪙
        </button>
      </div>

      <!-- TAB 2: INVENTAR / CHARAKTERE -->
      <div id="tab-inventory" class="tab-content">
        <div id="inventory-list">
          <!-- Dynamisch per JS befüllt -->
        </div>
      </div>

      <!-- TAB 3: CASINO -->
      <div id="tab-casino" class="tab-content">
        <div class="gamble-box">
          <h4>🎰 Kaktus-Slot Machine</h4>
          <div id="slot-display">
            <span>🌵</span> <span>🌵</span> <span>🌵</span>
          </div>
          <button id="spin-slot-btn" class="btn-action btn-gold">
            Drehen (Kosten: 50 🪙)
          </button>
          <button id="open-box-btn" class="btn-action btn-purple" style="margin-top: 8px;">
            Geheim-Kiste öffnen (Kosten: 100 💧)
          </button>
        </div>
      </div>

    </section>

  </div>

  <!-- ZUFALLSEVENT ITEM -->
  <div id="random-event-item" class="hidden">
    ⭐
  </div>

  <!-- Relativer Pfad für das Skript -->
  <script src="script.js"></script>
</body>
</html>
